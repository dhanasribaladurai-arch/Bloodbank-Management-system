<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LifeBlood</title>

    <link rel="stylesheet" href="C:\python full stack\Bloodbank Management\CSS\login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <div class="login-image">

            <i class="fa-solid fa-droplet"></i>

            <h1>LifeBlood</h1>

            <p>
                Together we can save lives.
            </p>

        </div>


        <div class="login-form">

            <h2>Welcome Back</h2>

            <p>Login to your account</p>

            <form action="C:\python full stack\Bloodbank Management\Html\dashboard.html">

                <label>Email</label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>
                    
                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <label>Password</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="C:\python full stack\Bloodbank Management\Html\register.html">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>
</html>
