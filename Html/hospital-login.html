<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hospital Login - LifeBlood</title>

    <link rel="stylesheet"
        href="C:\python full stack\Bloodbank Management\CSS\hospital-login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


    <div class="login-container">


        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="hospital-icon">

                <i class="fa-solid fa-hospital"></i>

            </div>

            <h1>Hospital Login</h1>

            <p>
                Welcome to LifeBlood
            </p>

            <p class="description">

                Login to request blood,
                manage requests and
                view request history.

            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-right">

            <h2>Hospital Login</h2>

            <p class="subtitle">
                Login to your hospital account
            </p>


            <form action="C:\python full stack\Bloodbank Management\Html\hospital.html">


                <!-- HOSPITAL ID -->

                <label for="hospitalId">

                    Hospital ID

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-hospital"></i>

                    <input
                        type="text"
                        id="hospitalId"
                        placeholder="Enter Hospital ID"
                        required>

                </div>


                <!-- EMAIL -->

                <label for="email">

                    Email Address

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter hospital email"
                        required>

                </div>


                <!-- PASSWORD -->

                <label for="password">

                    Password

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                </div>


                <!-- REMEMBER -->

                <div class="remember">

                    <label>

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login as Hospital

                </button>


            </form>


            <!-- REGISTER -->

            <p class="register">

                Hospital not registered?

                <a href="#">
                    Register Hospital
                </a>

            </p>


            <!-- BACK -->

            <a href="C:\python full stack\Bloodbank Management\Html\login.html"
                class="back">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Main Login

            </a>

        </div>

    </div>


</body>

</html>
