<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Donor Login - LifeBlood</title>

    <link rel="stylesheet"
        href="C:\python full stack\Bloodbank Management\CSS\donor-login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="blood-icon">
                <i class="fa-solid fa-droplet"></i>
            </div>

            <h1>Donor Login</h1>

            <p>
                Welcome back, Donor!
            </p>

            <p class="description">
                Login to manage your donor profile,
                donation schedule and donation history.
            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-right">

            <h2>Donor Login</h2>

            <p class="subtitle">
                Login to your donor account
            </p>


            <form action="C:\python full stack\Bloodbank Management\Html\donor.html">


                <!-- EMAIL -->

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- REMEMBER -->

                <div class="remember">

                    <label>

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login as Donor

                </button>


            </form>


            <!-- REGISTER -->

            <p class="register">

                Don't have a donor account?

                <a href="C:\python full stack\Bloodbank Management\Html\register.html">
                    Register Now
                </a>

            </p>


            <!-- BACK -->

            <a href="C:\python full stack\Bloodbank Management\Html\login.html"
                class="back">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Main Login

            </a>

        </div>

    </div>

</body>

</html>
