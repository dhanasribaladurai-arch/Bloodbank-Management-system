<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Blood Request</title>

    <link rel="stylesheet" href="C:\python full stack\Bloodbank Management\CSS\request.css">

     <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <nav class="navbar">

        <h2><i class="fa-solid fa-droplet"></i> LifeBlood</h2>

        <a href="C:\python full stack\Bloodbank Management\Html\hospital.html">
            Back
        </a>

    </nav>


    <main>

        <div class="request-box">

            <h1>Blood Request</h1>

            <p>
                Submit a request for required blood units
            </p>


            <form>


                <label>Hospital Name</label>

                <input
                    type="text"
                    placeholder="Enter hospital name"
                    required>


                <label>Patient Name</label>

                <input
                    type="text"
                    placeholder="Enter patient name"
                    required>


                <label>Blood Group</label>

                <select required>

                    <option value="">
                        Select Blood Group
                    </option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>

                </select>


                <label>Required Units</label>

                <input
                    type="number"
                    min="1"
                    placeholder="Number of units"
                    required>


                <label>Emergency Level</label>

                <select>

                    <option>Normal</option>
                    <option>Urgent</option>
                    <option>Emergency</option>

                </select>


                <label>Contact Number</label>

                <input
                    type="tel"
                    placeholder="Hospital contact number"
                    required>


                <button type="submit">
                    Submit Blood Request
                </button>


            </form>

        </div>

    </main>

</body>
</html>
