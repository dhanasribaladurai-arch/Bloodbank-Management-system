<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - LifeBlood</title>

    <link rel="stylesheet" href="C:\python full stack\Bloodbank Management\CSS\login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <div class="login-image">

             <i class="fa-solid fa-droplet"></i>

            <h1>Join LifeBlood</h1>

            <p>
                Become a blood donor today.
            </p>

        </div>


        <div class="login-form">

            <h2>Create Account</h2>

            <p>Register as a donor</p>

            <form action="C:\python full stack\Bloodbank Management\Html\login.html">

                <label>Full Name</label>

                <div class="input-box">

                    <input
                        type="text"
                        placeholder="Enter your name"
                        required>

                </div>


                <label>Email</label>

                <div class="input-box">

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <label>Phone Number</label>

                <div class="input-box">

                    <input
                        type="tel"
                        placeholder="Enter phone number"
                        required>

                </div>


                <label>Blood Group</label>

                <div class="input-box">

                    <select required>

                        <option value="">Select Blood Group</option>

                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>O+</option>
                        <option>O-</option>
                        <option>AB+</option>
                        <option>AB-</option>

                    </select>

                </div>


                <label>Password</label>

                <div class="input-box">

                    <input
                        type="password"
                        placeholder="Create password"
                        required>

                </div>


                <button type="submit">
                    Register
                </button>

            </form>

        </div>

    </div>

</body>
</html>
